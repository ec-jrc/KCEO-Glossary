<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to CEOS EO Glossary</title>
  <script>
    // Redirect all KCEO Glossary paths to the corresponding CEOS EO Glossary path
    var path = window.location.pathname;
    // Remove the /KCEO-Glossary/ prefix
    var prefix = '/KCEO-Glossary/';
    if (path.indexOf(prefix) === 0) {
      path = path.substring(prefix.length);
    }
    // Remove leading slash if any
    if (path.charAt(0) === '/') {
      path = path.substring(1);
    }
    var newUrl = 'https://ceos-org.github.io/eo-glossary/' + path + window.location.search + window.location.hash;
    window.location.replace(newUrl);
  </script>
  <noscript>
    <meta http-equiv="refresh" content="0; url=https://ceos-org.github.io/eo-glossary/">
  </noscript>
</head>
<body>
  <p>This glossary has moved to <a href="https://ceos-org.github.io/eo-glossary/">https://ceos-org.github.io/eo-glossary/</a>.</p>
</body>
</html>
